[package]
name = "krabby"
version = "0.3.0"
authors = ["Yann Jorelle <yann@jorelle.fi>"]
description = "Print pokemon sprites in your terminal"
repository = "https://github.com/yannjor/krabby"
homepage = "https://github.com/yannjor/krabby"
edition = "2021"
readme = "README.md"
license = "GPL-3.0"
keywords = ["pokemon", "terminal", "cli"]
categories = ["command-line-utilities"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rand", "dep:thiserror", "dep:dirs", "dep:toml"]

[[bin]]
name = "krabby"
path = "src/main.rs"
required-features = ["cli"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Cli
clap = { version = "4.5.18", features = ["derive"], optional = true }
serde = { version = "1.0.210", features = ["derive"]}
serde_json = "1.0.128"
rand = { version = "0.8.5", optional = true }
rust-embed = { version = "8.5.0", features = ["debug-embed"] }
thiserror = { version = "1.0.64", optional = true }
# Config
dirs = { version = "5.0.1", optional = true }
toml = { version = "0.8.19", optional = true }
